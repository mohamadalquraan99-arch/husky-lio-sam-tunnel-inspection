tunnel_anomaly_detector:
  ros__parameters:
    use_sim_time: true

    current_cloud_topic: /lio_sam/mapping/map_global
    # Leave empty for live-topic mode. Pass current_pcd:=... for dense offline comparison.
    current_pcd: ''
    # Integrated mission mode waits for the manager to publish the saved PCD path.
    wait_for_trigger: false
    trigger_topic: /inspection/run_detection
    output_frame: map
    processing_period_s: 5.0
    # Safest first test: process the first complete map received, then stop computing.
    process_once: true

    # Downsample both maps before comparison to reduce noise and CPU use.
    voxel_leaf_size_m: 0.15

    # A current point farther than this from the baseline becomes a candidate.
    change_distance_threshold_m: 0.35

    # Keep only spatially connected candidate groups, not isolated noise.
    cluster_tolerance_m: 0.40
    minimum_cluster_points: 25
    maximum_cluster_points: 100000

    # Start disabled because both LIO-SAM maps should already use the map frame.
    # Enable later only if the next mission has a measurable global offset.
    use_icp_alignment: true
    icp_max_correspondence_distance_m: 1.0
    icp_max_iterations: 30
    icp_max_fitness_score: 0.20
